    <!-- Third-party analytics/ads never compete with the first useful paint. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-6ZVG9CJEG8", { send_page_view: false });

      (function () {
        var loaded = false;
        var fallbackTimer;

        function addScript(src, marker) {
          if (document.querySelector("script[" + marker + "]")) return;
          var script = document.createElement("script");
          script.async = true;
          script.setAttribute(marker, "1");
          script.src = src;
          document.head.appendChild(script);
        }

        function loadDeferredThirdParty() {
          if (loaded) return;
          loaded = true;
          cleanup();

          addScript(
            "https://www.googletagmanager.com/gtag/js?id=G-6ZVG9CJEG8",
            "data-ga-loader",
          );
          window.setTimeout(function () {
            var path = window.location.pathname || "/";
            var blockedForAds =
              /^\/(?:login|onboarding|premium|admin(?:\/|$)|admin-studio|dashboard|learning-insights|my-data|contact|book-demo|demo-success|marks-recovery|board-exam-diagnostic|pdf-viewer|reel|ask)(?:\/|$)/.test(
                path,
              ) ||
              /^\/practice\//.test(path) ||
              /^\/(?:daily-practice|study-coach|exam-mode)(?:\/|$)/.test(
                path,
              ) ||
              /^\/tests\//.test(path) ||
              /^\/(?:privacy|terms|access-policy)(?:\/|$)/.test(path);

            if (!blockedForAds) {
              addScript(
                "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8111198978029240",
                "data-adsense-loader",
              );
            }
          }, 1200);
        }

        function cleanup() {
          window.clearTimeout(fallbackTimer);
          ["pointerdown", "touchstart", "keydown"].forEach(
            function (eventName) {
              window.removeEventListener(eventName, loadDeferredThirdParty);
            },
          );
        }

        ["pointerdown", "touchstart", "keydown"].forEach(function (eventName) {
          window.addEventListener(eventName, loadDeferredThirdParty, {
            once: true,
            passive: true,
          });
        });

        window.addEventListener(
          "load",
          function () {
            fallbackTimer = window.setTimeout(loadDeferredThirdParty, 4000);
          },
          { once: true },
        );
      })();
    </script>
