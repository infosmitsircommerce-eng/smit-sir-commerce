    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6ZVG9CJEG8', { send_page_view: false });

      (function () {
        var loaded = false;
        var fallbackTimer;

        function addScript(src, marker) {
          if (document.querySelector('script[' + marker + ']')) return;
          var script = document.createElement('script');
          script.async = true;
          script.setAttribute(marker, '1');
          script.src = src;
          document.head.appendChild(script);
        }

        function loadDeferredThirdParty() {
          if (loaded) return;
          loaded = true;
          cleanup();

          addScript('https://www.googletagmanager.com/gtag/js?id=G-6ZVG9CJEG8', 'data-ga-loader');
          window.setTimeout(function () {
            addScript('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8111198978029240', 'data-adsense-loader');
          }, 1200);
        }

        function cleanup() {
          window.clearTimeout(fallbackTimer);
          ['pointerdown', 'touchstart', 'keydown'].forEach(function (eventName) {
            window.removeEventListener(eventName, loadDeferredThirdParty);
          });
        }

        ['pointerdown', 'touchstart', 'keydown'].forEach(function (eventName) {
          window.addEventListener(eventName, loadDeferredThirdParty, { once: true, passive: true });
        });

        window.addEventListener('load', function () {
          fallbackTimer = window.setTimeout(loadDeferredThirdParty, 4000);
        }, { once: true });
      })();
    </script>
