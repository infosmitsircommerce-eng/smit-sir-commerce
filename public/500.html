<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FAF6EE" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Something went wrong | Smit Sir Commerce</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf6ee;color:#1e1812;font-family:Arial,sans-serif;padding:24px}.card{width:min(620px,100%);background:#fff;border:1px solid rgba(184,135,47,.24);border-radius:24px;padding:42px 30px;text-align:center;box-shadow:0 24px 70px rgba(30,24,18,.09)}.brand{font-size:13px;font-weight:800;letter-spacing:.18em;color:#b8872f;text-transform:uppercase}.code{font-size:72px;line-height:1;font-weight:800;margin:18px 0 8px;color:#b8872f}.card h1{font-family:Georgia,serif;font-size:32px;margin:0 0 14px}.card p{line-height:1.65;color:#6d6258;margin:0 auto 22px;max-width:480px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.btn{display:inline-block;padding:12px 18px;border-radius:999px;text-decoration:none;font-weight:700}.primary{background:#b8872f;color:#fff}.secondary{border:1px solid #d8cab8;color:#1e1812;background:#fff}.meta{margin-top:26px;font-size:11px;color:#a08f7f;word-break:break-word}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">Smit Sir Commerce</div>
      <div class="code">500</div>
      <h1>Something went wrong.</h1>
      <p>The website hit a temporary server problem. Your learning resources have not intentionally been removed. Please try again in a moment.</p>
      <div class="actions">
        <a class="btn primary" href="/">Go to Home</a>
        <a class="btn secondary" href="/contact">Contact Support</a>
      </div>
      <div class="meta">Error: ::vercel:ERROR_CODE:: · Request ID: ::vercel:REQUEST_ID::</div>
    </main>
  </body>
</html>
