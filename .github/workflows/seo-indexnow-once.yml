name: One-time IndexNow submission

on:
  push:
    branches:
      - seo-traffic-engine-2026-09-26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Submit changed SEO URLs to IndexNow
        run: node scripts/submit-indexnow.mjs
